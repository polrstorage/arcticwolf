apiVersion: v1
kind: ConfigMap
metadata:
  name: arcticwolf-config
  labels:
    app: arcticwolf
data:
  config.toml: |
    [server]
    bind_address = "0.0.0.0"
    nfs_port = 2049
    mount_port = 0

    # Two exports so the multi-export wiring is exercised end-to-end in
    # CI: /data is the read-write export the POSIX suite drives against,
    # /backup is a second rw export used to verify per-export isolation
    # and showmount listing.
    [[exports]]
    name = "/data"
    uid = 1
    read_only = false
    backend = "local"
    path = "/tmp/nfs_data"

    [[exports]]
    name = "/backup"
    uid = 2
    read_only = false
    backend = "local"
    path = "/tmp/nfs_backup"

    [logging]
    level = "debug"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arcticwolf
  labels:
    app: arcticwolf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arcticwolf
  template:
    metadata:
      labels:
        app: arcticwolf
    spec:
      hostNetwork: true
      containers:
        - name: arcticwolf
          image: freezevicente/arcticwolf:latest
          ports:
            - containerPort: 111
              name: portmap
              protocol: TCP
            - containerPort: 2049
              name: nfs
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "info"
          volumeMounts:
            - name: nfs-data
              mountPath: /tmp/nfs_data
            - name: nfs-backup
              mountPath: /tmp/nfs_backup
            - name: config
              mountPath: /etc/arcticwolf
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: nfs-data
          persistentVolumeClaim:
            claimName: nfs-exports
        - name: nfs-backup
          emptyDir: {}
        - name: config
          configMap:
            name: arcticwolf-config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-exports
  labels:
    app: arcticwolf
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
