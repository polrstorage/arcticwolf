name: NFS Test Factory

on:
  workflow_call:

jobs:
  nfstest:
    name: Run NFS Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Earthly
        uses: earthly/actions-setup@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          make image
          docker tag freezevicente/arcticwolf:latest arcticwolf:test

      # The test steps live in ci/nfstest.sh so they can also be run
      # outside GitHub Actions.
      - name: Set up k3s and NFS client
        run: ./ci/nfstest.sh setup

      - name: Deploy arcticwolf
        run: ./ci/nfstest.sh deploy

      - name: Verify exports, isolation, read-only and fsstat
        run: ./ci/nfstest.sh verify

      # skip test open until we start to review the failures
      # read/write tests are mandatory and must pass
      - name: Run NFS POSIX tests against /data
        run: ./ci/nfstest.sh posix

      - name: Get pod logs
        if: always()
        run: ./ci/nfstest.sh logs

      - name: Cleanup
        if: always()
        run: ./ci/nfstest.sh cleanup
