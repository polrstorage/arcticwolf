# Arctic Wolf NFS Server Configuration
# Copy this file to /etc/arcticwolf/config.toml

[server]
# Listen address (default: "0.0.0.0")
bind_address = "0.0.0.0"
# NFS port (default: 2049)
nfs_port = 2049
# Mount daemon port (default: 0 = dynamic, OS-assigned)
# Portmapper is always on port 111 (RFC 1833)
mount_port = 0

# Each [[exports]] entry defines one NFS export.
#
# Required keys:
#   name       - export path advertised to clients; must start with '/'
#   uid        - non-zero, unique per-export identifier (used in file handles)
#   backend    - storage backend type; currently only "local"
#
# Optional keys:
#   read_only  - if true, deny writes against this export (default: false)
#
# Backend-specific keys (sit alongside the keys above):
#   local backend: path - absolute path on the server's local filesystem

[[exports]]
name = "/data"
uid = 1
read_only = false
backend = "local"
path = "/srv/nfs/data"

[[exports]]
name = "/backup"
uid = 2
read_only = true
backend = "local"
path = "/srv/nfs/backup"

[logging]
# Log level: "error", "warn", "info", "debug", "trace" (default: "info")
level = "info"
